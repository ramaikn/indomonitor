server.address=127.0.0.1
server.port=${API_PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USER:media_api}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.flyway.url=${JDBC_DATABASE_URL}
spring.flyway.user=${MIGRATION_USER:media_owner}
spring.flyway.password=${MIGRATION_PASSWORD}
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
media.admin-key=${ADMIN_API_KEY}
media.ai-url=${AI_BASE_URL:http://127.0.0.1:20128/v1}
media.ai-key=${AI_API_KEY:}
media.ai-model=${AI_MODEL:ag/gemini-3.8-flash-low}
media.search-url=${SEARCH_BASE_URL:http://127.0.0.1:20128/v1}
media.search-key=${SEARCH_API_KEY:}
media.search-model=${SEARCH_MODEL:}
media.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
