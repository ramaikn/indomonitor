[project]
name = "media-intelligence-pipeline"
version = "0.1.0"
description = "Ingestion berita GDELT dengan provenance dan transaksi PostgreSQL"
requires-python = ">=3.12,<3.14"
dependencies = ["psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
media-ingest = "media_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
